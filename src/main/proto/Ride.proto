syntax = "proto3";

package com.AmbGo.Back;


option java_multiple_files = true;
option java_package = "com.AmbGoSocketConn.RideRequest";
option java_outer_classname = "Ride";

message RideAcceptenceRequest{
    int32 driver_id=1;
    int32 booking_id=2;
}

message RideAcceptanceResponse{
    bool success = 1;
}


service RideService{
    rpc acceptRide(RideAcceptenceRequest) returns (RideAcceptanceResponse);
}

service RideNotificationService{
    rpc notifyDriversForNewRide(RideNotificationRequest) returns (RideNotificationResponse);
}

message RideNotificationRequest{
    int64 pickUpLattitude=1;
    int64 pickUpLongtide=2;
    int64 distance =3;
    string fare=4;
    int32 bookingId=5;
    repeated int64 driverId=6;
}

message RideNotificationResponse{
    bool success =1;
}